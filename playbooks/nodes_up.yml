---
- name: Setup project with venv and Makefile
  hosts: validators:service_nodes
  become: yes

  tasks:

    - name : Docker up
      ansible.builtin.shell: |
        make core-dev-up
      args:
        chdir: "/root/xian-stack"
        executable: /bin/bash
      ignore_errors: yes
      become: yes

    - name: Nodes up with BDS
      ansible.builtin.shell: |
        make up-bds
      args:
        chdir: "/root/xian-stack"
        executable: /bin/bash
      ignore_errors: yes
      become: yes
      when: is_service_node | bool

    - name: Nodes up without BDS
      ansible.builtin.shell: |
        make up
      args:
        chdir: "/root/xian-stack"
        executable: /bin/bash
      ignore_errors: yes
      become: yes
      when: not is_service_node | bool